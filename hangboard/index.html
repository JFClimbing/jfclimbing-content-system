<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0d">
<title>指力训练 · Hangboard Timer</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#0b0b0d; --card:#17171a; --card2:#202024; --line:#2c2c31;
  --txt:#f2f2f5; --muted:#8a8a92;
  --orange:#ff9f0a; --green:#30d158; --blue:#0a84ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.views{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}

/* ─── 计时页 ─── */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:6px 16px;min-height:0}
.phase{font-size:14px;font-weight:700;letter-spacing:.16em;color:var(--muted);margin-bottom:4px}
.cd{font-size:clamp(60px,22vw,112px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--orange);position:relative;z-index:1}
.cd.small{font-size:clamp(46px,15vw,78px);color:var(--muted)}
.sub{margin-top:10px;font-size:14px;color:var(--muted);font-weight:600;min-height:20px;text-align:center;position:relative;z-index:1}
.sub b{color:var(--txt)}
.ringwrap{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:.16}
.ringwrap svg{width:min(68vw,264px);height:min(68vw,264px);transform:rotate(-90deg)}
.ringwrap circle{fill:none;stroke-width:6;stroke-linecap:round}
#ringFg{transition:stroke-dashoffset .3s linear}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line);flex:none}
.cell{background:var(--bg);padding:11px 14px;min-height:64px;display:flex;flex-direction:column;justify-content:center;position:relative;cursor:pointer}
.cell:active{background:var(--card)}
.cell .k{font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
.cell .v{font-size:16px;font-weight:800;line-height:1.35;padding-right:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell .v.o{color:var(--orange)}.cell .v.g{color:var(--green)}
.cell .v.sm{font-size:14px}
.cell::after{content:"›";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:#3a3a40;font-size:17px;font-weight:700}
.cell.plain{cursor:default}
.cell.plain::after{display:none}

/* ─── 播放器 ─── */
.player{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex:none}
.ptrack{flex:1;min-width:0;font-size:12.5px;color:var(--muted);font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.ptrack.on{color:var(--orange)}
.pbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.pbtn:active{background:var(--card2)}
.pbtn.main{width:40px;height:40px;color:var(--txt);background:var(--card2)}
.pbtn.on{color:var(--orange);border-color:rgba(255,159,10,.5);background:rgba(255,159,10,.14)}

/* ─── 控制条 ─── */
.ctrl{padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;flex:none}
.play{flex:1;height:68px;border:none;border-radius:34px;background:var(--green);color:#fff;font-size:24px;font-weight:800;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(48,209,88,.12);cursor:pointer;transition:transform .08s}
.play:active{transform:scale(.97)}
.play.run{background:var(--orange);box-shadow:0 0 0 6px rgba(255,159,10,.12)}
.play.pause{background:var(--blue);box-shadow:0 0 0 6px rgba(10,132,255,.12)}
.round{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--txt);cursor:pointer;flex:none}

/* ─── 底部导航 ─── */
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom);flex:none}
.tabbar button{flex:1;padding:10px 0 8px;border:none;background:transparent;color:var(--muted);font-size:11px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabbar button svg{width:20px;height:20px}
.tabbar button.on{color:var(--orange)}

/* ─── 页面 ─── */
.page{flex:1;overflow-y:auto;padding:6px 16px 28px;-webkit-overflow-scrolling:touch}
.grp{margin-top:16px}
.grp h3{font-size:12px;color:var(--muted);letter-spacing:.1em;margin:0 0 8px 2px;font-weight:700}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .lab{flex:1;font-size:14.5px;font-weight:600}
.row .lab small{display:block;color:var(--muted);font-size:12px;margin-top:2px;font-weight:400}
.sw{width:48px;height:28px;border-radius:14px;background:var(--card2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#6d6d75}
.sw.on{background:rgba(48,209,88,.28);border-color:rgba(48,209,88,.5)}
.sw.on::after{left:23px;background:var(--green)}
.btn{width:100%;padding:13px;border-radius:13px;border:none;font-size:15px;font-weight:800;cursor:pointer;margin-top:12px}
.btn.pri{background:var(--orange);color:#000}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);margin-top:8px}

/* ─── 音乐列表 ─── */
.track{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 9px;margin-bottom:7px}
.track.on{border-color:var(--orange);background:rgba(255,159,10,.09)}
.track .tp{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--orange);font-size:13px;flex:none;cursor:pointer}
.track input{flex:1;background:transparent;border:none;color:var(--txt);font-size:14px;font-weight:600;outline:none;min-width:0}
.track .tx{padding:6px 9px;border-radius:7px;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;flex:none}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 0}
.filebtn{display:block;width:100%;text-align:center;padding:13px;border-radius:13px;background:var(--card2);border:1px dashed var(--line);color:var(--txt);font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}

/* ─── 底部弹出面板 ─── */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .2s;z-index:80}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;
  transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);z-index:81;
  max-width:560px;margin:0 auto;padding-bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;max-height:82vh}
.sheet.on{transform:translateY(0)}
.sh-head{display:flex;align-items:center;padding:14px 18px 10px;flex:none;border-bottom:1px solid var(--line)}
.sh-head span{flex:1;font-size:16px;font-weight:800}
.sh-x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.sh-body{padding:12px 18px 0;overflow-y:auto;-webkit-overflow-scrolling:touch}

.blk{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.blk-top{display:flex;align-items:center;gap:8px}
.blk-no{width:20px;height:20px;border-radius:50%;background:var(--line);color:var(--muted);font-size:11px;font-weight:800;display:grid;place-items:center;flex:none}
.blk-name{flex:1;background:transparent;border:none;color:var(--txt);font-size:15px;font-weight:800;outline:none;min-width:0;padding:2px 0}
.blk-x{color:var(--muted);font-size:17px;cursor:pointer;padding:0 2px}
.blk-row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.blk-row .lb{font-size:12px;color:var(--muted);font-weight:700;flex:none}
.stp{display:flex;align-items:center;background:var(--card);border-radius:9px;border:1px solid var(--line);overflow:hidden;flex:none}
.stp button{width:34px;height:34px;border:none;background:transparent;color:var(--txt);font-size:17px;font-weight:700;cursor:pointer}
.stp button:active{background:var(--line)}
.stp .v{min-width:52px;text-align:center;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.stp .v small{font-size:10px;color:var(--muted);margin-left:1px}
.sel{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 10px;font-size:13px;font-weight:600;margin-top:8px;appearance:none;-webkit-appearance:none}
.sel2{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 10px;font-size:13px;font-weight:600;appearance:none;-webkit-appearance:none}
.pickrow{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.pickrow:last-child{border-bottom:none}
.pickrow .pn{flex:1;font-size:15px;font-weight:700}
.pickrow .pd{font-size:12px;color:var(--muted);font-weight:600}
.pickrow.on .pn{color:var(--orange)}

.hrow{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:7px}
.hrow .h1{font-size:14px;font-weight:700}
.hrow .h2{font-size:12px;color:var(--muted);margin-top:3px}
.stat{font-size:13px;color:var(--muted);line-height:2}
.stat b{color:var(--txt)}
.done .cd{color:var(--green)!important}
</style>
</head>
<body>
<div class="app">
  <div class="views">
    <!-- 计时 -->
    <section class="view on" id="view-timer">
      <div class="stage">
        <div class="ringwrap">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="46" stroke="#ffffff" stroke-dasharray="289 289" stroke-dashoffset="0" opacity=".2"/>
            <circle cx="50" cy="50" r="46" stroke="#ff9f0a" stroke-dasharray="289 289" stroke-dashoffset="289" id="ringFg"/>
          </svg>
        </div>
        <div class="phase" id="phase">准备开始</div>
        <div class="cd" id="cd">00:00</div>
        <div class="sub" id="sub"></div>
      </div>

      <div class="grid">
        <div class="cell" data-q="plan"><div class="k">训练计划</div><div class="v sm" id="gPlan">—</div></div>
        <div class="cell" data-q="blocks"><div class="k">动作</div><div class="v sm" id="gBlocks">—</div></div>
        <div class="cell" data-q="total"><div class="k">总时长</div><div class="v o" id="gTotal">00:00</div></div>
        <div class="cell" data-q="sets"><div class="k">组数</div><div class="v g" id="gSets">—</div></div>
        <div class="cell" data-q="warm"><div class="k">热身</div><div class="v" id="gWarm">00:00</div></div>
        <div class="cell" data-q="cool"><div class="k">放松</div><div class="v" id="gCool">00:00</div></div>
      </div>

      <div class="player">
        <button class="pbtn" id="prevTrack" aria-label="上一首">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 5l-9 7 9 7V5z"/><rect x="4.9" y="5" width="2.6" height="14" rx="1"/></svg>
        </button>
        <button class="pbtn main" id="playMusic" aria-label="播放/暂停">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="pbtn" id="nextTrack" aria-label="下一首">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M5 5l9 7-9 7V5z"/><rect x="16.5" y="5" width="2.6" height="14" rx="1"/></svg>
        </button>
        <span class="ptrack" id="pTrack">未选择音乐</span>
      </div>

      <div class="ctrl">
        <button class="round" id="btnReset" aria-label="重置">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 4v5h5"/></svg>
        </button>
        <button class="play" id="btnPlay">开始</button>
        <button class="round" id="btnSkip" aria-label="跳过">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M5 5l9 7-9 7V5z"/><rect x="16.5" y="5" width="2.6" height="14" rx="1"/></svg>
        </button>
      </div>
    </section>

    <!-- 音乐 -->
    <section class="view" id="view-music"><div class="page" id="musicPage"></div></section>

    <!-- 记录 -->
    <section class="view" id="view-log"><div class="page" id="logPage"></div></section>

    <!-- 设置 -->
    <section class="view" id="view-set"><div class="page" id="setPage"></div></section>
  </div>

  <nav class="tabbar">
    <button data-tab="timer" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>计时
    </button>
    <button data-tab="music">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>音乐
    </button>
    <button data-tab="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>记录
    </button>
    <button data-tab="set">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4"/></svg>设置
    </button>
  </nav>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="sh-head"><span id="shTitle">设置</span><button class="sh-x" id="shClose">✕</button></div>
  <div class="sh-body" id="shBody"></div>
</div>

<audio id="bgm" loop preload="auto"></audio>
<script src="app.js?v=25"></script>
</body>
</html>
